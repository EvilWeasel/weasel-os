# Own VPS management routes. Host keys are already pinned in known_hosts.
# Iris' cloud firewall permits SSH from Hephaestus; use that existing route.
Host hephaestus-netbird
    HostName 100.96.10.221
    HostKeyAlias 100.96.10.221
    User hermes
    IdentityAgent /run/user/1000/proton-infra-ssh-agent.sock
    IdentityFile ~/.ssh/weasel-own-infra-admin.pub
    IdentityFile ~/.ssh/evilweasel.cloud
    IdentitiesOnly yes
    StrictHostKeyChecking yes
    ForwardAgent no
    ConnectTimeout 8
    ServerAliveInterval 30
    ServerAliveCountMax 2

Host hephaestus-root
    HostName 100.96.10.221
    HostKeyAlias 100.96.10.221
    User root
    IdentityAgent /run/user/1000/proton-infra-ssh-agent.sock
    IdentityFile ~/.ssh/weasel-own-infra-admin.pub
    IdentityFile ~/.ssh/evilweasel.cloud
    IdentitiesOnly yes
    StrictHostKeyChecking yes
    ForwardAgent no
    ConnectTimeout 8
    ServerAliveInterval 30
    ServerAliveCountMax 2

Host iris iris-aidan
    HostName 46.225.77.36
    HostKeyAlias 46.225.77.36
    User aidan
    IdentityAgent /run/user/1000/proton-infra-ssh-agent.sock
    IdentityFile ~/.ssh/weasel-own-infra-admin.pub
    IdentityFile ~/.ssh/evilweasel.cloud
    IdentitiesOnly yes
    StrictHostKeyChecking yes
    ForwardAgent no
    ProxyJump hephaestus-root
    ConnectTimeout 8
    ServerAliveInterval 30
    ServerAliveCountMax 2
