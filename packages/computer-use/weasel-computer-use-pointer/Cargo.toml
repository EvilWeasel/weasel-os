[package]
name = "weasel-computer-use-pointer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Output-bound persistent Wayland virtual pointer transport"

[dependencies]
wayland-client = "=0.31.14"
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
libc = "=0.2.190"
