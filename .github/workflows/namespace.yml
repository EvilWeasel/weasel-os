name: Namespace Nix CI

on:
  push:
    branches: [main]
    paths: ['**/*.nix', 'flake.lock', '.github/workflows/namespace.yml']
  pull_request:
    paths: ['**/*.nix', 'flake.lock', '.github/workflows/namespace.yml']
  workflow_dispatch:
    inputs:
      build:
        description: Build both host systems after evaluation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: namespace-nix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hosts:
    if: vars.CI_ENABLED == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'namespace-profile-ci-builder' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        host: [nixy-laptop, nixy-desktop]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Restore persistent Nix store
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          cache: nix
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 4
            cores = 2
      - name: Evaluate locked flake and host
        run: |
          nix eval --no-write-lock-file --raw .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel.drvPath > host.drv
          # The flake imports generated sources during evaluation; allow their realization.
          nix flake check --no-write-lock-file
      - name: Inspect and build evaluated host
        if: github.event_name == 'workflow_dispatch' && inputs.build
        run: |
          nix build --dry-run --no-link "$(cat host.drv)^*"
          nix build --no-link --print-build-logs "$(cat host.drv)^*"
      - name: Confirm lockfile preservation
        run: git diff --exit-code -- flake.lock
